name: "Install Project"
description: "Installs node, npm, and dependencies"
inputs:
  node-version:
    description: "Node.js version"
    required: true
    # Pinned: Node >=24.16 breaks Electron install (extract-zip). electron/electron#51619
    default: "24.15.0"
  npm-version:
    description: "npm version"
    required: true
    default: "11"
runs:
  using: "composite"
  steps:
    # The npm publish jobs stay on GitHub-hosted runners, which have no Namespace
    # cache volume, so they cache npm downloads the GitHub way instead.
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: "https://registry.npmjs.org"
        cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
    - name: Install npm
      shell: bash
      run: npm install -g npm@${{ inputs.npm-version }}
    # The cache volume is shared by every branch and has no keys, so it holds
    # the npm and Electron downloads rather than node_modules, and `npm ci`
    # installs from disk. On macOS the volume is attached by symlink, and npm
    # replaces a symlinked node_modules with a real folder.
    - name: Cache npm and Electron downloads
      if: runner.environment == 'self-hosted'
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        path: |
          ~/.npm
          ${{ runner.os == 'macOS' && '~/Library/Caches/electron' || '~/.cache/electron' }}
    - name: Install Dependencies
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund
    # An interrupted install can be missing Electron's binary, which fails every
    # test job with "Electron failed to install correctly".
    - name: Verify Electron
      shell: bash
      run: node -e "require('electron')" || node node_modules/electron/install.js
