name: Pull Request Title Format

on:
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - reopened
      - edited
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prTitle:
    name: Check
    if: github.repository == 'pixijs/pixijs'
    runs-on: namespace-profile-linux-8-16
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check PR Title
        uses: actions/github-script@v8
        with:
          script: |
            const { default: checkPrTitle } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-title-check.mjs`);
            await checkPrTitle({ github, context, core });
